name: rag-private

networks:
  rag-network:
    external: true

volumes:
  private-gpt-data:

services:
  private-gpt:
    image: zylonai/private-gpt:0.6.2-ollama
    container_name: rag-private
    user: root
    ports:
      - "8002:8080"
    environment:
      - PGPT_PROFILES=docker
      - PGPT_MODE=ollama
      - PGPT_EMBED_MODE=ollama
      - PGPT_OLLAMA_API_BASE=http://ollama:11434
      - PGPT_OLLAMA_LLM_MODEL=qwen2.5:1.5b
      - PGPT_OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - private-gpt-data:/home/worker/app/local_data
    networks:
      - rag-network
    restart: unless-stopped