name: rag-stack

networks:
  rag-network:
    external: true

volumes:
  ollama-data:
  private-gpt-data:
  open-webui-data:

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - rag-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull nomic-embed-text
        ollama pull qwen2.5:1.5b
        wait
    restart: unless-stopped

  private-gpt:
    image: zylonai/private-gpt:0.6.2-ollama
    container_name: rag-private
    user: root
    ports:
      - "8002:8080"
    environment:
      - PGPT_PROFILES=docker
      - PGPT_MODE=ollama
      - PGPT_EMBED_MODE=ollama
      - PGPT_OLLAMA_API_BASE=http://ollama:11434
      - PGPT_OLLAMA_LLM_MODEL=qwen2.5:1.5b
      - PGPT_OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - private-gpt-data:/home/worker/app/local_data
    networks:
      - rag-network
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-webui
    ports:
      - "3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - rag-network
    restart: unless-stopped